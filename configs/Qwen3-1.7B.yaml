name: default
mode: train # pretrain | grain

resume_global_step: -1  # -1: don't resume,   int: resume from global steps,  latest: resume from latest
test_global_step: latest # int: test at global steps,  latest: test at latest

run:
  seed: 42
  use_amp: false           # set false to disable AMP (can't be used now, bugs)
  gradient_accumulation_steps: 4
  device: cuda                # auto | cuda | cpu
  use_gradient_checkpoint: true
  
paths:
  model_path: "./models/Qwen3-1.7B"
  output_dir: "qwen-finetuned"   # final save; checkpoints go under Hydra's run dir unless overridden

data:
  context_max_length: 1024
  conversation_max_length: 1024
  train_batch_size: 1
  eval_batch_size: 1
  num_workers: 4
  # Switch between "mock" and "hf" when you add a real dataset loader
  source: squad

optim:
  learning_rate: 0.00005
  weight_decay: 0.01
  adapter_reg: 0.0 # 0.000001
  num_epochs: 1
  warmup_steps: 2000
  grad_clip_norm: 1.0

pretrain:
  completion_freq: 0.5
  max_completion_ratio: 0.3
  min_completion_ratio: 0.1

visualize:
  visualize_steps: -1
  visualize_mode: "pretrain"

logging:
  logging_steps: 1

eval:
  eval_steps: 1250

save:
  save_steps: 1250
  # save_best: true    # best files sometimes corrupted, disable for now

# If you use a custom local module for LoRA-wrapped Qwen, keep it here.
# Otherwise, replace with a transformers model import path and update train.py accordingly.
model:
  lora_r: 4
  metalora_r: 4
  ift_additional_metalora_r: -1 # <0: finetune pretrain metalora;  >=0: freeze pretrain metalora, add new metalora with this r
  num_mem_token: ${num_mem_token}
  metamodel_class_path: "LoraQwen.LoraQwen3ForCausalLM" # module.ClassName
  config_class_path: "LoraQwen.Qwen3Config" # module.ClassName
  tokenizer_from: "${paths.model_path}"
  model_from: "${paths.model_path}"

peft:
  qwen:
    enabled: false
    adapter_path: null       # Set to an existing PEFT adapter dir to continue Qwen LoRA training.
    adapter_name: default
    r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    bias: none
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  m2p:
    enabled: false
    adapter_path: null       # Set to an existing PEFT adapter dir to continue M2P LoRA training.
    adapter_name: default
    r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    bias: none
    target_modules: []       # Empty means infer Linear targets from M2P named_modules.

metanetwork:
  type: "transformer"
  method: "rl"
  transformer_cfg:
    encoder_cfg:
      d_model: 2048 # Fixed
      nhead: 16
      dim_feedforward: 4096
      dropout: 0
      activation: gelu
      layer_norm_eps: 0.00001
      batch_first: True
      norm_first: False
      bias: True
    couple_encoder_cfg:
      d_model: 2048
      nhead: 16
      dim_feedforward: 4096
      dropout: 0
      activation: gelu
      layer_norm_eps: 0.00001
      batch_first: True
      norm_first: False
      bias: True
    layer_transformer_first: True
    mean_pool_size: 1 # Don't use
    num_layers: 4 # Must be even
    couple_num_layers: 0 # if > 0, use couple layers
    scale: 0.001
  linear_cfg:
    num_layers: 4
    linear_hidden_dim: 8192
    scale: 0.001
    bias: false
  linear_gate_cfg:
    num_layers: 4
    linear_hidden_dim: 8192
    scale: 0.001
    bias: false
    

test:
  source: squad
  context_avg_len: 512
  context_max_length: 1300
  conversation_max_length: 128
  max_new_tokens: 128
  save_path: test/${name}
  batch_size: 4
  num_workers: 4 
  judger_model: gpt-4.1-nano
  max_concurrency: 32
  max_retries: 6

hydra:
  job:
    chdir: false
  run:
    # everyone uses the SAME dir
    dir: checkpoints/${name}/${mode}/${now:%H-%M-%S}
  output_subdir: null  # avoid multiple `.hydra` subdirs trying to coexist

hidden_size: -1
num_layers: -1

# doc2lora x SHINE multi-chunk (default off -> plain single-pass SHINE)
lora_ortho_update: true   # orthogonal LoRA update (1-alpha)*x@W vs base W; default ON

multichunk:
  enabled: false
  n_sink: 4
  n_local: 32
  page_size: 64
  query_aware_mix: true
  mix_top_k: 8
  mix_temp: 1.0
  norm_rule: energy       # off | energy
  norm_lam: 1.0
  var_rank: true
  mix_rescale: 1.0        # fixed scalar multiplied onto the combined LoRA AFTER the softmax mix
  ortho_combine: true     # combine-level sequential orthogonalization of pages; default ON
num_mem_token: 4